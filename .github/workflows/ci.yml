name: PAC Core CI

on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: C++20 core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPAC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  android-arm64:
    name: Android Oboe compile (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;3.22.1"
      - name: Install Android NDK (retry transient download failures)
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "NDK installation attempt $attempt/3"
            if yes | "$SDKMANAGER" --install "ndk;27.2.12479018"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "NDK installation failed after 3 attempts"
          exit 1
      - name: Configure Android
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DANDROID_STL=c++_shared
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DPAC_BUILD_TESTS=OFF
      - name: Build Android backend
        run: cmake --build build-android --config Release --parallel
