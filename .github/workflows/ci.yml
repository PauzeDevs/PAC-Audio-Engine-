name: PAC Core CI

on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: C++20 core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPAC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  android-arm64:
    name: Android Oboe compile (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;3.22.1 ndk;27.2.12479018"
      - name: Configure Android
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DANDROID_STL=c++_shared
          -DPAC_BUILD_TESTS=OFF
      - name: Build Android backend
        run: cmake --build build-android --config Release --parallel
