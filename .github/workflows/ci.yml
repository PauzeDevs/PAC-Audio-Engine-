name: PAC Core CI
on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    name: C++20 build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPAC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
